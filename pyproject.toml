[project]
name = "jobright"
version = "0.4.0"
description = "A free, honest job-search agent: finds jobs that fit you, tailors your resume from real facts, applies with you in control. No API key needed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ChandraChaan" }]
keywords = ["job search", "auto apply", "resume", "ai agent", "claude", "ollama", "local llm", "linkedin", "naukri", "reed", "playwright", "career"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
]
dependencies = [
    "anthropic>=2.3",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "playwright>=1.50",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/ChandraChaan/jobright"
Issues = "https://github.com/ChandraChaan/jobright/issues"

[project.scripts]
jobright = "jobright.cli:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobright*"]

[tool.setuptools.package-data]
jobright = ["prompts/*.md", "templates/*.j2", "templates/dash/*.j2", "templates/setup/*.j2", "defaults/*.yaml"]
