# Defaults for every user. Your own choices live in ~/.jobright/settings.yaml
# (written by the setup wizard) and override these key by key; tracks,
# searches and ats_boards are replaced whole.

profile:
  country: null              # IN, GB, US… (see countries.yaml); set by the setup wizard
  setup_complete: false

targets:
  # Titles that are never a fit (free check, before any API cost). The setup
  # wizard adds level-specific words: senior profiles exclude "Intern",
  # "Graduate", "Junior"; graduate profiles exclude "Senior", "Lead", "Principal".
  title_exclude: [Sales, Marketing, Recruiter, Recruitment, Accountant, Finance, Legal, Tax, Customer Support,
                  Support Specialist, Operations Manager, Account Manager, Account Executive, Business Development,
                  Compliance, Teacher, Nurse, Driver, Warehouse]
  # A job's location must name one of these. Filled from your country and cities.
  locations: []

# Role tracks: which kinds of role to pursue and how much evidence each needs.
# Generated by the setup wizard from your resume; edit them any time.
# Each: titles (phrases a job title may contain), weight (ranking), min_fit
# (bar for that track), stretch (true = second, deeper fit check first).
tracks: {}

apply_rules:
  min_skill_match: 40          # weighted: a must-have skill counts twice a nice-to-have one
  min_fit_score: 50
  max_years_short: 1           # skip when the JD asks for more than your years + this
  overqualified_gap: 4         # note when the JD's max years is this far below yours
  skip_overqualified: false

exclude_companies: []          # e.g. your current employer

# Per site; generated from your tracks and cities by the setup wizard.
searches: {}

# Company career boards with public APIs (no login). Country defaults are
# added by the wizard; add your own target companies any time.
ats_boards: {}

limits:
  linkedin_per_day: 25
  naukri_per_day: 40
  reed_per_day: 25
  indeed_per_day: 20
  ats_per_day: 20
  tailored_per_day: 15        # tailored resumes per day (~$0.25 each)
  analyze_per_run: 80         # job descriptions read per run (~$0.002 each)
  deep_checks_per_run: 15     # second opinions on stretch-track jobs (~$0.03 each)
  linkedin_pages_per_run: 60
  monthly_budget_usd: 60      # paid steps stop when this month's Claude spend reaches it
  max_attempts: 3
  max_per_company_30d: 3

apply:
  # false = review mode: everything is prepared, nothing is sent until you
  # press Approve. Switch a site to true once you trust it.
  auto_submit:
    linkedin: false
    naukri: false
    reed: false
    indeed: false
    ats: false
  browser_headless: false
  accept_application_consent: false

models:
  analyze: claude-haiku-5-5
  deep_fit: claude-sonnet-5-5
  tailor: claude-opus-5-5
  verify: claude-sonnet-5-5
  answer: claude-sonnet-5-5

resume:
  max_pages: 2
  file_stem: null            # defaults to First_Last from your profile

schedule:
  every_hours: 3

dashboard:
  port: 8765
